<div class="app-layout">
  <!-- Floating Glassmorphic Header -->
  <div class="header-wrapper">
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="logo-icon">
            <!-- PulseNotify logo mark: bell + pulse indicator + shine -->
            <svg class="logo-svg" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFA040"/>
                  <stop offset="100%" stop-color="#FF4400"/>
                </linearGradient>
                <linearGradient id="shineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
                  <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </linearGradient>
              </defs>
              <!-- Bell body -->
              <path d="M20 6 C13.4 6 8 11.4 8 18 C8 24.5 5 27 5 27 L35 27 C35 27 32 24.5 32 18 C32 11.4 26.6 6 20 6 Z"
                    fill="url(#logoGrad)"/>
              <!-- Bell clapper -->
              <circle cx="20" cy="31" r="2.8" fill="url(#logoGrad)"/>
              <!-- Pulse dot (live indicator) -->
              <circle cx="29" cy="9" r="4" fill="#FF9500"/>
              <circle cx="29" cy="9" r="2.2" fill="#FFE066"/>
              <!-- Shine overlay -->
              <path d="M13 10 C15 8 18 7 20 7 C22 7 24.5 8 26 10 C24 9 22 8.5 20 8.5 C18 8.5 15.5 9 13 10 Z"
                    fill="url(#shineGrad)"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1>Pulse<span class="brand-accent">Notify</span></h1>
            <span class="subtitle">Configurable Notification Engine</span>
          </div>
        </div>

        <nav class="nav-tabs">
          <button
            class="nav-tab"
            [class.active]="activeTab === 'rules'"
            (click)="switchTab('rules')"
          >
            Rules Engine
          </button>
          <button
            class="nav-tab"
            [class.active]="activeTab === 'form'"
            (click)="switchTab('form')"
          >
            {{ ruleToEdit ? 'Edit Rule' : 'New Rule Builder' }}
          </button>
          <button
            class="nav-tab"
            [class.active]="activeTab === 'history'"
            (click)="switchTab('history')"
          >
            Dispatch Logs
          </button>
          <button
            class="nav-tab"
            [class.active]="activeTab === 'simulator'"
            (click)="switchTab('simulator')"
          >
            Live Simulator
          </button>
        </nav>
      </div>
    </header>
  </div>

  <!-- Main Content Area -->
  <main class="main-content">
    <app-rule-list
      *ngIf="activeTab === 'rules'"
      (editRule)="onEditRule($event)"
      (createNew)="onCreateNewRule()"
    ></app-rule-list>

    <app-rule-form
      *ngIf="activeTab === 'form'"
      [ruleToEdit]="ruleToEdit"
      (saved)="onRuleSaved()"
      (cancelled)="onFormCancelled()"
    ></app-rule-form>

    <app-notification-history
      *ngIf="activeTab === 'history'"
    ></app-notification-history>

    <app-event-simulator
      *ngIf="activeTab === 'simulator'"
    ></app-event-simulator>
  </main>
</div>
